name: build-zh-image

# 汉化镜像自动构建：zh-cn 分支有改动就重新编译并推到 GHCR。
# 用 Actions 自带的 GITHUB_TOKEN（声明 packages: write），不需要任何 PAT。
on:
  push:
    branches: [zh-cn]
    paths:
      - "web/**"
      - "server/**"
      - "cmd/**"
      - "agent/**"
      - "db/**"
      - "guard/**"
      - "traffic/**"
      - "intercept/**"
      - "llmrec/**"
      - "llmpool/**"
      - "notify/**"
      - "report/**"
      - "selfupdate/**"
      - "evidence/**"
      - "enrich/**"
      - "mcphttp/**"
      - "sidequestion/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.zh"
      - "build-zh.sh"
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - ".github/workflows/zh-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # 与上游对齐的版本号（会写进二进制，页面 /api/health 显示它）
  ARTEX_VERSION: "0.3.21"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端静态导出
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          NEXT_EXPORT=1 npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 放入 go:embed 目录并编译单二进制
        run: |
          set -eux
          rm -rf server/webui/dist
          mkdir -p server/webui dist/amd64
          cp -r web/out server/webui/dist
          CGO_ENABLED=0 go build -tags embedui \
            -ldflags "-s -w -buildid= -X main.version=${ARTEX_VERSION}" \
            -o dist/amd64/artex ./cmd/artex
          ls -la dist/amd64/artex

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        run: |
          set -eux
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/artex-zh-cn"
          SHA=$(git rev-parse --short HEAD)
          docker build -f Dockerfile.zh \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${ARTEX_VERSION}-zh" \
            -t "${IMAGE}:sha-${SHA}" \
            .
          docker push --all-tags "${IMAGE}"

      - name: 摘要
        run: |
          {
            echo "### 汉化镜像已推送"
            echo
            echo '```'
            echo "ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/artex-zh-cn:latest"
            echo "版本标签：${ARTEX_VERSION}-zh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
